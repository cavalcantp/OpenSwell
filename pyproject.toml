[project]
name = "openswell"
version = "0.1.0"
description = "\"AI surfing assistant. It provides spot recommendations, based on local conditions, user skill level and preferences/goals\""
authors = [
    {name = "cavalcantep"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "fastapi (>=0.135.2,<0.136.0)",
    "langchain (>=1.2.13,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "huggingface-hub (>=1.8.0,<2.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "importlib-metadata (>=9.0.0,<10.0.0)",
    "langchain-huggingface (>=1.2.1,<2.0.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "langchain-openai (>=1.1.12,<2.0.0)",
    "timezonefinder (>=8.2.2,<9.0.0)",
    "pandas (>=3.0.1,<4.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
